services:
  db:
    image: pgrouting/pgrouting:16-3.6-3.4
    environment:
      POSTGRES_USER: aitguide
      POSTGRES_PASSWORD: aitguide
      POSTGRES_DB: aitguide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitguide"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: aitguide
      DB_PASSWORD: aitguide
      DB_NAME: aitguide
      SERVER_PORT: 8080
      SEED_DIR: db/seeds
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
